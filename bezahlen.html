<!doctype html>

<html>
  <head>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="bezahlen.css" />
    <title>Checkout</title>
  </head>
  <body>
    <h1>Bezahlen</h1>
    <div id="bezahlen-container">
      <div id="bezahlen-links">
        <div id="rechnungsadresse-form">
          <h3>Rechnungsadresse</h3>
          <select id="salutation" name="salutation">
            <option value="" disabled selected>--Anrede auswählen--</option>
            <option value="Herr">Herr</option>
            <option value="Frau">Frau</option>
            <option value="Divers">Divers</option>
            <option value="Firma">Firma</option>
          </select>
          <input type="text" id="name" name="name" placeholder="Vorname" />
          <input
            type="text"
            id="lastname"
            name="lastname"
            placeholder="Nachname"
          />

          <input type="text" id="email" name="email" placeholder="E-Mail" />
          <input
            type="text"
            id="email-confirmation"
            name="email-confirmation"
            placeholder="E-Mail bestätigen"
          />

          <input
            type="text"
            id="street"
            name="street"
            placeholder="Straße und Hausnummer"
          />
          <input
            type="text"
            id="postal-code"
            name="postal-code"
            placeholder="Postleitzahl"
          />
          <input type="text" id="city" name="city" placeholder="Stadt" />
        </div>

        <p>Bitte wählen Sie eine Zahlungsmethode aus.</p>
        <div id="payment-methods">
          <input
            type="radio"
            id="credit-card"
            name="payment-method"
            value="credit-card"
          />
          <label for="credit-card">
            <img
              src="Icons/mastercard.svg"
              alt="Mastercard"
              width="48"
              height="48"
            />
          </label>

          <input
            type="radio"
            id="paypal"
            name="payment-method"
            value="paypal-payment"
          />
          <label for="paypal">
            <img src="Icons/paypal.svg" alt="PayPal" width="48" height="48" />
          </label>
          <input
            type="radio"
            id="google-pay"
            name="payment-method"
            value="google-pay"
          />
          <label for="google-pay">
            <img
              src="Icons/google.svg"
              alt="Google Pay"
              width="48"
              height="48"
            />
          </label>
          <input
            type="radio"
            id="stripe"
            name="payment-method"
            value="stripe-payment"
          />
          <label for="stripe">
            <img src="Icons/stripe.svg" alt="Stripe" width="48" height="48" />
          </label>
          <input
            type="radio"
            id="visa"
            name="payment-method"
            value="visa-payment"
          />
          <label for="visa">
            <img src="Icons/visa.svg" alt="Visa" width="48" height="48" />
          </label>
        </div>

        <p id="payment-success-and-errors"></p>
        <div id="payment-form"></div>
      </div>
      <div id="bezahlen-rechts">
        <h2>Bestellübersicht</h2>
        <div id="order-summary">
          <p id="amount">3 Produkte</p>
          <p id="total-price">Gesamtpreis: 7,99 €</p>
        </div>
      </div>
    </div>

    <button id="pay-button" onClick="handlePayment()" disabled>
      Jetzt bezahlen
    </button>

    <script src="toasts.js"></script>
    <script src="bezahlen.js"></script>
    <script src="script.js"></script>
  </body>
</html>
