<!doctype html>
<html>
  <head>
    <title>Produkte</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header id="produkte-search-wrap">
      <input type="text" placeholder="Suche..." />
      <button id="produkte-filter" onclick="openFilterPopup()">
        <!-- Icon von https://heroicons.com/ -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          width="24"
          height="24"
        >
          <path
            d="M18.75 12.75h1.5a.75.75 0 0 0 0-1.5h-1.5a.75.75 0 0 0 0 1.5ZM12 6a.75.75 0 0 1 .75-.75h7.5a.75.75 0 0 1 0 1.5h-7.5A.75.75 0 0 1 12 6ZM12 18a.75.75 0 0 1 .75-.75h7.5a.75.75 0 0 1 0 1.5h-7.5A.75.75 0 0 1 12 18ZM3.75 6.75h1.5a.75.75 0 1 0 0-1.5h-1.5a.75.75 0 0 0 0 1.5ZM5.25 18.75h-1.5a.75.75 0 0 1 0-1.5h1.5a.75.75 0 0 1 0 1.5ZM3 12a.75.75 0 0 1 .75-.75h7.5a.75.75 0 0 1 0 1.5h-7.5A.75.75 0 0 1 3 12ZM9 3.75a2.25 2.25 0 1 0 0 4.5 2.25 2.25 0 0 0 0-4.5ZM12.75 12a2.25 2.25 0 1 1 4.5 0 2.25 2.25 0 0 1-4.5 0ZM9 15.75a2.25 2.25 0 1 0 0 4.5 2.25 2.25 0 0 0 0-4.5Z"
          />
        </svg>
      </button>
    </header>

    <div class="karten-container"></div>
    <div class="filter-popup">
      <h2>Filter</h2>
      <div class="filter-option">
        <label for="filber-category">Kategorie:</label>
        <select id="filter-category"></select>
      </div>
      <div class="filter-option">
        <label for="filter-price">Preis:</label>
        <input
          type="range"
          id="filter-price"
          min="0"
          max="1000"
          value="1000"
          step="10"
          oninput="
            this.nextElementSibling.value =
              this.value == 1000 ? 'Kein Limit' : this.value + '€'
          "
        />
        <output id="price-value">Kein Limit</output>
      </div>
      <button id="apply-filters">Filter anwenden</button>
    </div>

    <!-- Importiere Fuse.js (Search Library) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>

    <script src="script.js"></script>
    <script src="produkte.js"></script>
    <script src="filter.js"></script>
  </body>
</html>
